<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar Perfil | CineReview</title>
    <style>
      :root {
        --bg: #121212;
        --card: #1e1e1e;
        --primary: #e50914;
        --border: #333;
        --text: #fff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }
      body {
        background: var(--bg);
        color: white;
      }
      header {
        background: #1a1a1a;
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #333;
      }
      .logo {
        color: var(--primary);
        font-size: 24px;
        font-weight: bold;
        text-decoration: none;
      }
      .menu a {
        color: white;
        text-decoration: none;
        margin-left: 20px;
      }
      .menu a:hover {
        color: var(--primary);
      }
      .container {
        max-width: 600px;
        margin: 40px auto;
        padding: 20px;
      }
      .card {
        background: var(--card);
        padding: 30px;
        border-radius: 10px;
        border: 1px solid #333;
      }
      h1 {
        margin-bottom: 20px;
        color: var(--primary);
        text-align: center;
      }
      label {
        display: block;
        margin-bottom: 8px;
        color: #aaa;
      }
      input,
      textarea {
        width: 100%;
        padding: 12px;
        margin-bottom: 18px;
        border-radius: 6px;
        background: #212121;
        border: 1px solid var(--border);
        color: white;
      }
      textarea {
        min-height: 120px;
        resize: vertical;
      }
      button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        background: var(--primary);
        color: white;
        font-weight: bold;
        cursor: pointer;
      }
      button:hover {
        background: #b80710;
      }
      .actions {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }
      .actions a {
        display: inline-block;
        padding: 12px 18px;
        color: white;
        background: #333;
        border-radius: 6px;
        text-decoration: none;
        text-align: center;
        flex: 1;
      }
      .actions a:hover {
        background: var(--border);
      }
      .message {
        margin-bottom: 20px;
        padding: 14px;
        border-radius: 8px;
        display: none;
      }
      .message.success {
        background: #1b5d3b;
        color: #c8f7d4;
      }
      .message.error {
        background: #5d1b1b;
        color: #f7c8c8;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="telaInicial.html" class="logo">CineReview</a>
      <div class="menu">
        <a href="telaPerfil.html">Perfil</a>
        <a href="favoritos.html">Favoritos</a>
        <a href="minhasAvaliacoes.html">Avaliações</a>
        <a href="/logout" style="color: #aaa">Sair</a>
      </div>
    </header>

    <div class="container">
      <div class="card">
        <h1>Editar Perfil</h1>
        <div id="message" class="message"></div>
        <form id="editForm">
          <label for="nome">Nome</label>
          <input id="nome" name="nome" type="text" required />

          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />

          <label for="bio">Bio</label>
          <textarea id="bio" name="bio" placeholder="Conte um pouco sobre você..."></textarea>

          <label for="foto_perfil">Foto de Perfil</label>
          <input id="foto_perfil" name="foto_perfil" type="file" accept="image/*" />

          <button type="submit">Salvar Alterações</button>
        </form>
        <div class="actions">
          <a href="telaPerfil.html">Voltar ao Perfil</a>
          <a href="telaInicial.html">Ir para Início</a>
        </div>
      </div>
    </div>

    <script>
      const messageEl = document.getElementById("message");
      const form = document.getElementById("editForm");

      function showMessage(text, type) {
        messageEl.textContent = text;
        messageEl.className = `message ${type}`;
        messageEl.style.display = "block";
      }

      async function carregarUsuario() {
        try {
          const response = await fetch("/api/me");
          if (!response.ok) {
            window.location.href = "admTelaLogin.html";
            return;
          }

          const usuario = await response.json();
          document.getElementById("nome").value = usuario.nome || "";
          document.getElementById("email").value = usuario.email || "";
          document.getElementById("bio").value = usuario.bio || "";
        } catch (error) {
          console.error("Erro ao carregar usuário:", error);
          window.location.href = "admTelaLogin.html";
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const formData = new FormData(form);
        try {
          const response = await fetch("/api/usuarios/editar", {
            method: "POST",
            body: formData,
          });

          if (!response.ok) {
            const errorData = await response.json();
            showMessage(errorData.erro || "Erro ao atualizar perfil.", "error");
            return;
          }

          showMessage("Perfil atualizado com sucesso!", "success");
          setTimeout(() => {
            window.location.href = "telaPerfil.html";
          }, 1000);
        } catch (error) {
          console.error("Erro ao enviar formulário:", error);
          showMessage("Erro ao atualizar perfil. Tente novamente.", "error");
        }
      });

      carregarUsuario();
    </script>
  </body>
</html>
