<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil | CineReview</title>
    <style>
      :root {
        --bg: #121212;
        --card: #1e1e1e;
        --primary: #e50914;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }
      body {
        background: var(--bg);
        color: white;
      }
      header {
        background: #1a1a1a;
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #333;
      }
      .logo {
        color: var(--primary);
        font-size: 24px;
        font-weight: bold;
        text-decoration: none;
      }
      .menu a {
        color: white;
        text-decoration: none;
        margin-left: 20px;
      }
      .menu a:hover {
        color: var(--primary);
      }
      .container {
        max-width: 600px;
        margin: auto;
        padding: 40px;
      }
      .card {
        background: var(--card);
        padding: 30px;
        border-radius: 10px;
        border: 1px solid #333;
        text-align: center;
      }
      .profile-pic {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 20px;
        border: 3px solid var(--primary);
      }
      .info {
        margin-bottom: 20px;
        text-align: left;
      }
      label {
        color: #aaa;
        display: block;
        margin-bottom: 5px;
        font-size: 14px;
      }
      .valor {
        font-size: 18px;
        margin-bottom: 20px;
        padding-bottom: 5px;
        border-bottom: 1px solid #2b2b2b;
      }
      .btn {
        display: inline-block;
        padding: 12px 20px;
        background: var(--primary);
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
        margin-top: 10px;
      }
      .btn:hover {
        background: #b80710;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="telaInicial.html" class="logo">CineReview</a>
      <div class="menu">
        <a href="telaInicial.html">Início</a>
        <a href="favoritos.html">Favoritos</a>
        <a href="minhasAvaliacoes.html">Avaliações</a>
        <a href="/logout" style="color: #aaa">Sair</a>
      </div>
    </header>

    <div class="container">
      <div class="card">
        <img
          id="avatar"
          src="/uploads/default-avatar.png"
          class="profile-pic"
          alt="Foto de perfil"
          onerror="this.src = 'https://placehold.co/120'"
        />

        <div class="info">
          <label>Nome</label>
          <div class="valor" id="nome">Carregando...</div>
        </div>

        <div class="info">
          <label>Email</label>
          <div class="valor" id="email">Carregando...</div>
        </div>

        <div class="info">
          <label>Bio</label>
          <div class="valor" id="bio">Carregando...</div>
        </div>

        <a href="telaEditarPerfil.html" class="btn">Editar Perfil</a>
      </div>
    </div>

    <script>
      async function carregarUsuario() {
        try {
          const resposta = await fetch("/api/me");

          if (!resposta.ok) {
            window.location.href = "admTelaLogin.html";
            return;
          }

          const usuario = await resposta.json();

          document.getElementById("nome").textContent = usuario.nome;
          document.getElementById("email").textContent = usuario.email;
          document.getElementById("bio").textContent = usuario.bio || "Sem bio cadastrada.";

          if (usuario.foto_perfil) {
            document.getElementById("avatar").src = usuario.foto_perfil;
          }
        } catch (error) {
          console.error("Erro ao carregar dados do usuário:", error);
          window.location.href = "admTelaLogin.html";
        }
      }

      carregarUsuario();
    </script>
  </body>
</html>
