<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minhas Avaliações | CineReview</title>
    <style>
      :root {
        --bg: #121212;
        --card: #1e1e1e;
        --primary: #e50914;
        --border: #333;
        --text: #fff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }
      body {
        background: var(--bg);
        color: white;
      }
      header {
        background: #1a1a1a;
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #333;
      }
      .logo {
        color: var(--primary);
        font-size: 24px;
        font-weight: bold;
        text-decoration: none;
      }
      .menu a {
        color: white;
        text-decoration: none;
        margin-left: 20px;
      }
      .menu a:hover {
        color: var(--primary);
      }
      .container {
        max-width: 960px;
        margin: 40px auto;
        padding: 0 20px;
      }
      .title {
        margin-bottom: 20px;
        color: var(--primary);
        font-size: 32px;
      }
      .card {
        background: var(--card);
        padding: 20px;
        border-radius: 10px;
        border: 1px solid #333;
      }
      .card h3 {
        margin-bottom: 10px;
        color: var(--primary);
      }
      .empty {
        color: #aaa;
        padding: 40px;
        text-align: center;
        border: 1px dashed #444;
        border-radius: 10px;
        background: #191919;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/home" class="logo">CineReview</a>
      <div class="menu">
        <a href="/perfil">Perfil</a>
        <a href="/home">Início</a>
        <a href="/favoritos">Favoritos</a>
        <a href="/logout" style="color: #aaa">Sair</a>
      </div>
    </header>

    <div class="container">
      <div class="title">Minhas Avaliações</div>
      <div id="avaliacoes" class="grid"></div>
    </div>

    <script>
      const avaliacoes = [
        {
          titulo: "Nenhuma avaliação encontrada",
          texto:
            "Faça uma avaliação depois de assistir um filme para vê-la aqui.",
        },
      ];

      const div = document.getElementById("avaliacoes");
      div.innerHTML = avaliacoes
        .map(
          (item) => `
      <div class="card">
        <h3>${item.titulo}</h3>
        <p>${item.texto}</p>
      </div>
    `,
        )
        .join("");
    </script>
  </body>
</html>
