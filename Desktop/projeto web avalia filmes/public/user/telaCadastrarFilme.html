<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastrar Filme | CineReview</title>
    <style>
      :root {
        --bg: #121212;
        --card: #1e1e1e;
        --primary: #e50914;
        --border: #333;
        --text: #fff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }
      body {
        background: var(--bg);
        color: white;
      }
      header {
        background: #1a1a1a;
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #333;
      }
      .logo {
        color: var(--primary);
        font-size: 24px;
        font-weight: bold;
        text-decoration: none;
      }
      .menu a {
        color: white;
        text-decoration: none;
        margin-left: 20px;
      }
      .menu a:hover {
        color: var(--primary);
      }
      .container {
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
      }
      .card {
        background: var(--card);
        padding: 30px;
        border-radius: 10px;
        border: 1px solid #333;
      }
      h1 {
        color: var(--primary);
        margin-bottom: 20px;
        text-align: center;
      }
      label {
        display: block;
        margin-bottom: 8px;
        color: #aaa;
      }
      input,
      textarea {
        width: 100%;
        padding: 12px;
        margin-bottom: 16px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: #1f1f1f;
        color: white;
      }
      textarea {
        min-height: 120px;
        resize: vertical;
      }
      button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 6px;
        background: var(--primary);
        color: white;
        font-weight: bold;
        cursor: pointer;
      }
      button:hover {
        background: #b80710;
      }
      .links {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 20px;
        flex-wrap: wrap;
      }
      .links a {
        display: inline-block;
        padding: 12px 16px;
        border-radius: 6px;
        text-decoration: none;
        color: white;
        background: #333;
        text-align: center;
        flex: 1;
      }
      .links a:hover {
        background: #444;
      }
      .message {
        display: none;
        margin-bottom: 20px;
        padding: 14px;
        border-radius: 8px;
      }
      .message.success {
        background: #1b5d3b;
        color: #c8f7d4;
      }
      .message.error {
        background: #5d1b1b;
        color: #f7c8c8;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="telaInicial.html" class="logo">CineReview</a>
      <div class="menu">
        <a href="telaPerfil.html">Perfil</a>
        <a href="favoritos.html">Favoritos</a>
        <a href="minhasAvaliacoes.html">Avaliações</a>
        <a href="/logout" style="color: #aaa">Sair</a>
      </div>
    </header>

    <div class="container">
      <div class="card">
        <h1>Cadastrar Filme</h1>
        <div id="message" class="message"></div>
        <form id="cadastroFilmeForm">
          <label for="titulo">Título</label>
          <input id="titulo" name="titulo" type="text" placeholder="Nome do filme" required />

          <label for="ano_lancamento">Ano de Lançamento</label>
          <input id="ano_lancamento" name="ano_lancamento" type="number" placeholder="2024" required />

          <label for="diretor">Diretor</label>
          <input id="diretor" name="diretor" type="text" placeholder="Nome do diretor" required />

          <label for="sinopse">Sinopse</label>
          <textarea id="sinopse" name="sinopse" placeholder="Descrição do filme" required></textarea>

          <label for="capa_url">URL da Capa</label>
          <input id="capa_url" name="capa_url" type="url" placeholder="https://..." required />

          <button type="submit">Salvar Filme</button>
        </form>
        <div class="links">
          <a href="telaInicial.html">Voltar ao Início</a>
          <a href="telaPerfil.html">Meu Perfil</a>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById("cadastroFilmeForm");
      const message = document.getElementById("message");

      function showMessage(text, type) {
        message.textContent = text;
        message.className = `message ${type}`;
        message.style.display = "block";
      }

      // Restrição de Acesso no Front-end
      async function verificarAcesso() {
        try {
          const resposta = await fetch("/api/me");
          if (!resposta.ok) {
            window.location.href = "/login";
            return;
          }
          const usuario = await resposta.json();
          if (usuario.role !== 'ADMIN') {
            alert("Acesso negado. Apenas administradores podem acessar esta página.");
            window.location.href = "telaInicial.html";
          }
        } catch (erro) {
          window.location.href = "/login";
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const data = {
          titulo: form.titulo.value.trim(),
          ano_lancamento: Number(form.ano_lancamento.value),
          diretor: form.diretor.value.trim(),
          sinopse: form.sinopse.value.trim(),
          capa_url: form.capa_url.value.trim(),
        };

        try {
          const response = await fetch("/api/filmes", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(data),
          });

          if (!response.ok) {
            const result = await response.json();
            showMessage(result.erro || "Erro ao cadastrar filme.", "error");
            return;
          }

          showMessage("Filme cadastrado com sucesso! Redirecionando...", "success");
          setTimeout(() => {
            window.location.href = "telaInicial.html";
          }, 1500);
        } catch (error) {
          console.error("Erro ao cadastrar filme:", error);
          showMessage("Erro ao cadastrar filme. Tente novamente.", "error");
        }
      });

      verificarAcesso();
    </script>
  </body>
</html>
